name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      # Save your code, then re-create Android folder with v2 embedding
      - run: cp lib/main.dart /tmp/main.dart
      - run: cp pubspec.yaml /tmp/pubspec.yaml
      - run: flutter create . --project-name mama_teachers_group --org com.ihsaanu.mamateachers --platforms android
      - run: cp /tmp/main.dart lib/main.dart
      - run: cp /tmp/pubspec.yaml pubspec.yaml
      - run: cp assets/logo.png assets/logo.png || true

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Mama-Teachers-Group-APK
          path: build/app/outputs/flutter-apk/app-release.apk
