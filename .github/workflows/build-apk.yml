name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      # Save your code, then re-create Android folder with v2 embedding
      - run: cp lib/main.dart /tmp/main.dart
      - run: cp pubspec.yaml /tmp/pubspec.yaml
      - run: flutter create . --project-name mama_teachers_group --org com.ihsaanu.mamateachers --platforms android
      - run: cp /tmp/main.dart lib/main.dart
      - run: cp /tmp/pubspec.yaml pubspec.yaml

      # FIX 1: Restore Firebase config
      - run: cp google-services.json android/app/google-services.json
      - run: ls -l android/app/google-services.json

      # FIX 2: Add Google Services plugin so Firebase works
      - run: |
          ls -l android/
          cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle 2>/dev/null || echo "no settings file"
      - run: |
          if [ -f android/settings.gradle.kts ]; then
            grep -q "google-services" android/settings.gradle.kts || sed -i 's|id("com.android.application") version ".*"|id("com.android.application") version "8.7.0" apply false\n    id("com.google.gms.google-services") version "4.4.2" apply false|' android/settings.gradle.kts
            cat android/settings.gradle.kts
          else
            grep -q "google-services" android/settings.gradle || sed -i 's|id "com.android.application" version ".*"|id "com.android.application" version "8.7.0" apply false\n    id "com.google.gms.google-services" version "4.4.2" apply false|' android/settings.gradle
            cat android/settings.gradle
          fi
      - run: |
          if [ -f android/app/build.gradle.kts ]; then
            grep -q "google-services" android/app/build.gradle.kts || sed -i 's|id("com.android.application")|id("com.android.application")\n    id("com.google.gms.google-services")|' android/app/build.gradle.kts
            cat android/app/build.gradle.kts
          else
            grep -q "google-services" android/app/build.gradle || sed -i 's|id "com.android.application"|id "com.android.application"\n    id "com.google.gms.google-services"|' android/app/build.gradle
            cat android/app/build.gradle
          fi
      # FIX 2b: Force package name to match Firebase
      - run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's|applicationId = ".*"|applicationId = "com.ihsaanu.mamateachers"|' android/app/build.gradle.kts
            grep -n "applicationId" android/app/build.gradle.kts
          else
            sed -i 's|applicationId ".*"|applicationId "com.ihsaanu.mamateachers"|' android/app/build.gradle
            grep -n "applicationId" android/app/build.gradle
          fi
      # FIX 3: Make your MTG logo the phone icon
      - run: flutter pub get
      - run: flutter pub run flutter_launcher_icons || dart run flutter_launcher_icons || true

      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Mama-Teachers-Group-APK
          path: build/app/outputs/flutter-apk/app-release.apk
