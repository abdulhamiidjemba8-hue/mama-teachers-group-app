name: mama_teachers_group
description: Mama Teachers Group - Cash Round
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  shared_preferences: ^2.2.2
  local_auth: ^2.2.0
  intl: ^0.20.2
  share_plus: ^12.0.2
  path_provider: ^2.1.2
  screenshot: ^3.0.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
